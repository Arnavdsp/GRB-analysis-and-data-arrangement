[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grbml"
version = "0.1.0"
description = "Clustering and classification of Fermi-GBM gamma-ray bursts from their prompt-emission light curves"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "pandas>=1.4",
    "matplotlib>=3.5",
    "scikit-learn>=1.3",
    "PyWavelets>=1.3",
]

[project.optional-dependencies]
umap = ["umap-learn>=0.5.3"]
hdbscan = ["hdbscan>=0.8.29"]
dev = ["pytest>=7.0"]

[project.scripts]
grbml = "grbml.cli:main"

[tool.setuptools]
packages = ["grbml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: tests that run the full embedding and take several seconds",
]
